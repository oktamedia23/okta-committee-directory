.pill-strong{background:linear-gradient(135deg,var(--okta-red),var(--okta-red-dark));color:#fff;border-color:transparent}

.hero::before{content:'';position:absolute;top:-50%;right:-10%;width:600px;height:600px;background:radial-gradient(circle,rgba(200,16,46,0.25) 0%,transparent 60%);border-radius:50%}

.hero-badge{display:inline-block;padding:6px 14px;background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.18);border-radius:999px;font-size:12px;font-weight:600;letter-spacing:0.5px;margin-bottom:18px}
